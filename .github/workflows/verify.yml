name: Verify
on:
  push:
    # Release tags and the publisher lock point to an already verified commit.
    # Rechecking them creates redundant runs during publication and retry.
    branches: ['**']
  pull_request:
permissions:
  contents: read
  # ci-plan.py looks up earlier runs of this workflow for the same commit.
  actions: read
# Mac and iOS tests run on a Mac with scripts/local-verify.py, which posts the
# "Mac tests (local)" commit status that landing and publication also require.
jobs:
  plan:
    # Skips the test jobs when this exact code already passed, and the privacy
    # scan when this exact commit was already scanned (see scripts/ci-plan.py).
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      tests: ${{ steps.plan.outputs.tests }}
      privacy: ${{ steps.plan.outputs.privacy }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: verify.yml
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: python3 scripts/ci-plan.py
  python:
    needs: plan
    if: needs.plan.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: python (${{ matrix.shard }}/3)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/ci-unittest-shard.py ${{ matrix.shard }} 3
  web:
    needs: plan
    if: needs.plan.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm --prefix pi-semantic-bridge ci --ignore-scripts
      - run: npm --prefix pi-semantic-bridge test
      - run: node --test tests/first_mate_web.test.cjs
      - run: npm --prefix frontend/herdr-web ci --ignore-scripts
      - run: npm --prefix frontend/herdr-web test
      - run: npm --prefix frontend/herdr-web run build
      # After the web build, so the wheel carries the built web client.
      - name: Build and exercise a standalone installation
        run: |
          python -m pip install build
          python -m build
          python -m venv /tmp/herdr-wheel
          /tmp/herdr-wheel/bin/python -m pip install dist/*.whl
          python scripts/verify-installed.py --python /tmp/herdr-wheel/bin/python
  privacy:
    needs: plan
    if: needs.plan.outputs.privacy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python scripts/check-public-source.py --staged
      - name: Scan published history for credentials
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner .
