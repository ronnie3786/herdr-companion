name: Verify
on:
  push:
    # Release tags and the publisher lock point to an already verified commit.
    # Rechecking them creates redundant runs during publication and retry.
    branches: ['**']
  pull_request:
permissions:
  contents: read
  # ci-plan.py looks up earlier runs of this workflow for the same commit.
  actions: read
jobs:
  plan:
    # Skips every test job when this exact commit is already verified, and
    # decides whether the iOS target must build (see scripts/ci-plan.py).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.plan.outputs.run }}
      ios: ${{ steps.plan.outputs.ios }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: verify.yml
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 scripts/ci-plan.py
  portable:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[dev]'
      - run: python -m unittest discover -s tests
      - run: npm --prefix pi-semantic-bridge ci --ignore-scripts
      - run: npm --prefix pi-semantic-bridge test
      - run: node --test tests/first_mate_web.test.cjs
      - run: npm --prefix frontend/herdr-web ci --ignore-scripts
      - run: npm --prefix frontend/herdr-web test
      - run: npm --prefix frontend/herdr-web run build
      - run: python scripts/check-public-source.py --staged
      - name: Build and exercise a standalone installation
        run: |
          python -m build
          python -m venv /tmp/herdr-wheel
          /tmp/herdr-wheel/bin/python -m pip install dist/*.whl
          python scripts/verify-installed.py --python /tmp/herdr-wheel/bin/python
      - name: Scan published history for credentials
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner .
  mac:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Cache Swift package checkouts
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.0
        with:
          path: /tmp/herdr-mac-derived/SourcePackages
          key: mac-swiftpm-${{ hashFiles('herdr-harness-mac/herdr-harness-mac.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s herdr-harness-mac/Scripts -p 'test_*.py'
      # One pass; a failure reruns only the failed tests, not every suite
      # (see scripts/ci-xcode-test.py).
      - name: Mac unit tests
        run: python scripts/ci-xcode-test.py --result-dir /tmp/herdr-mac-results -- -project herdr-harness-mac/herdr-harness-mac.xcodeproj -scheme herdr-harness-mac -destination 'platform=macOS' -derivedDataPath /tmp/herdr-mac-derived CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO -only-testing:herdr-harness-macTests
  ios:
    needs: plan
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.ios == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # Serial execution keeps simulator clones from starving suites that carry
      # one-minute time limits; only failed tests are retried before the job is red.
      - name: iOS unit tests
        run: |
          DEVICE_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for runtime,devices in d["devices"].items() if "iOS-26" in runtime for x in devices if "iPhone" in x["name"]))')
          python3 scripts/ci-xcode-test.py --result-dir /tmp/herdr-ios-results -- -project herdr-harness-ios/herdr-harness-ios.xcodeproj -scheme herdr-harness-ios -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath /tmp/herdr-ios-derived CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO -only-testing:herdr-harness-iosTests -parallel-testing-enabled NO
