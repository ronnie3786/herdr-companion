# Copy to ~/.config/herdr-companion/config.toml (recommended) or ./config.local.toml.
# Both are private operator files, never commit the filled-in copy.
# chmod 600 ~/.config/herdr-companion/config.toml
# Run: herdr-server --config ~/.config/herdr-companion/config.toml --machine desktop
# Precedence: explicit CLI flags, process environment, selected machine, shared values.
# Optional integrations are disabled until you configure their URLs and credentials.
version = 1
# machine = "desktop" # Or select with --machine / HERDR_MACHINE on each computer.

[server]
host = "127.0.0.1"
port = 9092
state_dir = "~/.local/share/herdr-companion"
no_browser = true
# api_token = "replace-with-a-long-random-token" # Keep only in your PRIVATE copy.
# api_token_file = "~/.config/herdr-companion/secrets/api-token" # Optional existing private file.
# api_token = { env = "MY_HERDR_API_TOKEN" } # Optional secret-manager injection.
# socket_path = "~/.config/herdr/api.sock"
# session = "default"
# terminal_command = "herdr"
# attachments_dir = "~/.local/share/herdr-companion/uploads"

# The SAME file can describe every computer. Select the local computer explicitly.
# A machine whose API credential is configured on this computer is one that this
# computer's CLIs and lead First Mate can reach (docs/first-mate/lead.md).
# URLs contain only public-to-your-cluster connection metadata, never tokens.
# Tailscale is optional: substitute your private hostname or another reachable URL.
[machines.desktop]
name = "Desktop"
role = "local"
url = "https://desktop.example.invalid"
# Optional Mac sidebar segment presentation. Orders are partial: explicitly
# ordered machines appear first; ties and machines without an order keep roster order.
sidebar_label = "Build"
sidebar_order = 1
ssh_host = "desktop.example.invalid"
ssh_user = "your-username"

[machines.desktop.server]
# Set host to a reachable interface only after configuring authentication.
host = "127.0.0.1"
# api_token = { env = "DESKTOP_HERDR_TOKEN" }

[machines.laptop]
name = "Laptop"
role = "work"
url = "https://laptop.example.invalid"
sidebar_label = "Lab"
sidebar_order = 0
ssh_host = "laptop.example.invalid"
ssh_user = "your-username"

[machines.laptop.server]
port = 9092
# api_token = { env = "LAPTOP_HERDR_TOKEN" }

[machines.worker]
name = "Worker"
role = "development"
url = "https://worker.example.invalid"
ssh_host = "worker.example.invalid"
ssh_user = "your-username"

# Machine-specific implementation overrides can use any shared section.
[machines.worker.environment]
# PI_CODING_AGENT_DIR = "/home/your-username/.pi/agent"

[providers.cleanup]
# model = "your-provider/your-model" # Optional cleanup model selection.
# thinking_level = "medium"
# pi_binary = "/path/to/pi"

[providers.activity]
# url = "http://model.example.invalid:8000/v1"
# model = "your-model-id"
debounce_seconds = 20

[providers.summary]
# OpenAI-compatible endpoint, optional Pi provider lookup when provider is set.
# url = "http://model.example.invalid:8000/v1"
# provider = "your-pi-provider"
# model = "your-model-id"
# api_key = { env = "SUMMARY_API_KEY" }
# api_key_file = "~/.config/herdr-companion/secrets/summary-key"

[providers.tts]
# Kokoro/OpenAI-compatible speech API; leave URL unset to disable response audio.
# url = "http://speech.example.invalid:8000"
voice = "af_jessica"
speed = 1.0

[providers.voice]
# Required to dispatch quick voice agents. Provider/model must exist in Pi.
# provider = "your-pi-provider"
# model = "your-model-id"
thinking_level = "high"

[providers.transcription]
# backend = "openai" # Or "parakeet" for an audio-field multipart API.
# url = "http://speech.example.invalid:8000/v1/audio/transcriptions"
# model = "your-transcription-model"
# token = { env = "TRANSCRIPTION_API_KEY" }

[fleet]
# Explicitly selecting a repository establishes the trusted catalog origin.
# repository = "https://github.com/YOUR-OWNER/YOUR-CATALOG.git"
# checkout = "~/.local/share/herdr-fleet/catalog"
# allow_local_repository = true # Opt in only for a catalog you trust on disk.

# Optional separate skill roots. Catalog destination names must be configured here.
# Roots must not overlap each other or the standard agents/Pi install roots.
[fleet.skill_destinations]
# assistant = "~/.local/share/your-assistant/skills"

[active_work]
# url = "https://desktop.example.invalid"
# token = { env = "HERDR_BOARD_TOKEN" }
# manage_token_file = "~/.config/herdr-companion/secrets/manage-token"
# ingest_token_file = "~/.config/herdr-companion/secrets/ingest-token"
# workflow_root = "~/projects/your-workflows" # Optional Buzz integration.
# workflows_dir = "~/.local/share/herdr-companion/workflows" # Local workflow JSON definitions; defaults to <state_dir>/workflows.

[first_mate]
# Each feature gets a saved Pi coordinator and independent worker sessions.
# Pi must be available to the server with a configured provider/login.
# model = "your-provider/your-model" # Omit to use Pi's configured default.
# coordinator_thinking = "low"
# planner_model = "your-provider/your-planning-model"
# planner_thinking = "high"
# worker_model = "your-provider/your-execution-model"
# worker_thinking = "medium"
# architect_model = "your-provider/your-architect-model" # Required for architect reviews/implementation second opinions; no fallback or role re-routing.
# architect_thinking = "high"
# research_scout_model = "your-provider/your-research-model" # Required for explicit Research Scout assignments.
# research_scout_thinking = "high"
# research_scout_instructions_file = "~/.config/herdr-companion/agents/research-scout.md" # Private company/tool instructions, never commit the contents.
# Agent Roles in the Mac app copies selected local skill packages to this host.
# Role names, prompts, and strict skill selections are private server state.
# Existing roles inherit Pi discovery until explicitly changed; custom roles start empty.
# Optional host-side catalogs for API clients (paths are relative to this config):
# skill_sources = { Personal = "~/.pi/agent/skills", Project = "~/projects/example/.agents/skills" }
# Omit to discover ~/.pi/agent/skills and ~/.agents/skills; {} disables host scanning.
# Role defaults belong in the operator's private configuration. A feature can
# override only its coordinator selection for the next coordinator turn.
max_workers = 8
# Recovery switch for hosts where historical usage scans delay opening chats.
# false keeps conversations and saved sessions accessible, with usage unavailable.
# Saved history is preserved. Restart the companion after changing this setting.
usage_enabled = true
context_target = 150000
stall_seconds = 600
peer_timeout_seconds = 60 # Cross-machine First Mate reads/relays; bounded to 15–300 seconds.
coordinator_timeout_seconds = 86400 # Inactivity; model output/completed tools renew it.
coordinator_max_seconds = 604800 # Seven-day absolute ceiling, even with continuous activity.
# Service-owned checks continue with every client closed. No model polling.
auto_recovery = true
sweep_seconds = 3600 # Hourly stale-progress sweep (minimum 300 seconds).
nudge_grace_seconds = 300 # Respond/provide a wait lease before a verified restart.
minimum_free_mb = 1024 # Admission reserve on both state and workspace volumes.
# Automatic continuation preserves stage/gate boundaries and requires safe receipts.
# Private recovery archives: 64 MiB payload / 72 MiB serialized, 1 GiB total.
# Archives are never automatically restored or deleted.
# State defaults to first-mate.sqlite3 and first-mate-runs under server.state_dir.
# message_hub_url = "https://messages.example.invalid/api/v1/messages"
# message_hub_token_file = "~/.config/herdr-companion/secrets/message-hub-token"
# app_url = "https://desktop.example.invalid/first-mate/"
# Stage completion and unrecoverable stability failures notify when configured.
# Skims: a short, linked rewrite of each long First Mate reply and HUD chat
# turn, made by one tool-free model call after the reply is saved. See
# docs/first-mate/skim.md. Use a fast model; the key it needs goes in the
# private config's [environment] table (servers under launchd have no login shell).
skim = true
# skim_model = "your-provider/your-fast-model" # Omit to use Pi's configured default.
skim_thinking = "low" # Never "off" with small thinking models: it can run away.
skim_min_words = 80 # Shorter replies are shown as they are.
# skim_hud_chats = true # Also skim HUD chat replies.
# skim_backfill_hours = 24 # Skim recent earlier replies once; 0 skims only new ones.
# Ambiguous delivery is logged, without an automatic duplicate phone alert.

[simportal]
# Optional First Mate simulator checkpoints and previews through SimPortal on
# THIS machine (docs/first-mate/simulator-previews.md). Inert until url is set.
# url = "http://127.0.0.1:4280"
# token_file = "~/.config/herdr-companion/secrets/simportal-token" # Owner-only file with SimPortal's service token.
# intake_root = "~/.simportal/builds" # Must be one of SimPortal's lifecycle.artifactRoots.
# project_id = "herdr"
# device_type = "com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro"
# runtime = "com.apple.CoreSimulator.SimRuntime.iOS-26-2" # Omit for the newest compatible installed iOS runtime.
# idle_shutdown_minutes = 60 # Shut down a Herdr preview nobody has watched this long; 0 turns it off.
# max_running_previews = 4 # Opening one more shuts down the least recently watched idle preview.
# server_id = "" # Set only to accept a replaced SimPortal server explicitly.

[remote_activity]
# url = "https://worker.example.invalid"
# token = { env = "WORKER_HERDR_TOKEN" }
prefix = "worker"
poll_seconds = 10

[integrations]
# github_repository = "YOUR-OWNER/YOUR-REPOSITORY" # Optional PR review watcher.
# jira_url = "https://YOUR-SITE.atlassian.net"
# review_model = "your-provider/your-model"
# review_exclude_globs = "*.generated.*,vendor/*" # Optional; default includes every file.
# review_assessor = "~/.pi/agent/agents/pr-review-assessor.md"

# [pr_review]
# PR Review workspace (see docs/pr-review.md). Runs on the machine whose role is "development";
# the Mac app picks that machine (Settings → Machines → PR review host overrides it). All optional.
# workspace_label = "PR Reviews" # Dedicated Herdr workspace holding one tab per review.
# workspace_root = "~/projects" # Working directory used only when that workspace has to be created.
# checkout_root = "~/.local/share/herdr-companion/pr-review-runs/checkouts" # Shared clones and per-review worktrees.
# store_path = "~/.local/share/herdr-companion/pr-review.sqlite3" # Ledger of reviews, runs, documents, events.
# runs_root = "~/.local/share/herdr-companion/pr-review-runs" # PR metadata, diffs, documents, run logs.
# runner = "pi" # Agent launched for skill runs; uses the host's Pi settings by default.
# model = "your-provider/your-model" # Pi model for impact ranking and Ask AI; omit for Pi's default.
# thinking_level = "medium"
# auto_rank = true # Rank files by impact after a review is prepared.
# sync_viewed_to_github = true # Push viewed toggles to GitHub through gh.
# gh_timeout_seconds = 120 # 10–900.
# checkout_timeout_seconds = 900 # Clone, fetch, and checkout commands, 10–3600.
# pi_binary = "/path/to/pi" # Optional explicit binaries when the service PATH differs.
# claude_binary = "/path/to/claude"

[code_factory]
# Automated issue-to-release pipeline (see docs/code-factory.md). All optional.
# repository = "YOUR-OWNER/YOUR-REPOSITORY" # Required for issue reports and Code Factory.
# checkout = "~/projects/your-checkout" # Git checkout whose origin is that repository.
# worktree_root = "~/.local/share/herdr-companion/code-factory/worktrees"
# trigger_label = "herdr-autofix"
# allowed_authors = "your-github-login" # Comma-separated; defaults to the gh login.
# planner_model = "anthropic/claude-fable-5-1"
# planner_thinking = "high"
# implementer_model = "openai-codex/gpt-6-sol"
# implementer_thinking = "xhigh"
# reviewer_model = "anthropic/claude-opus-5-5"
# reviewer_thinking = "high"
# anthropic_runner = "claude" # Use your Claude Code subscription login for Anthropic roles; default is "pi".
# claude_binary = "/path/to/claude" # Optional when the LaunchAgent PATH cannot find Claude Code.
# max_parallel_issues = 2
# max_review_rounds = 3
# max_ci_failures = 3
# session_timeout_seconds = 3600 # Global Pi-session cap for planners, implementers and reviewers.
# reviser_session_timeout_seconds = 7200 # Revision sessions legitimately run longer; bounded separately.
# max_rebase_attempts = 2 # Bounded conflict-resolution rebases; a rebase does not consume review/CI budget.
# max_transient_retries = 2 # Bounded automatic retries after a provider 5xx/network/timeout failure.
# dashboard_host = "tailscale" # A literal IP/host, or "tailscale" to bind the Tailscale IPv4.
# dashboard_port = 9097
# dashboard_token = { file = "~/.config/herdr-companion/secrets/code-factory-token" }
# dashboard_link = "https://factory.example.invalid:9097/" # Optional canonical link for Message Me alerts.
# release_enabled = true # Requires [deployment.macos_release] on this machine.
# require_ready_approval = false # true parks each reviewed draft PR until you mark it ready.
# release_channel = "preview"

[apple]
# Set an identifier namespace that you own when signing/distributing builds.
bundle_prefix = "org.herdr.companion"
# team_id = "YOUR_TEAM_ID"
# ios_bundle_id = "org.yourname.herdr.ios"
# mac_bundle_id = "org.yourname.herdr.macos"
# widget_bundle_id = "org.yourname.herdr.ios.widget"
# terminal_bundle_id = "org.yourname.terminal" # Optional Mac terminal application.
# keychain_service = "org.yourname.herdr"
mac_keychain_backend = "login" # Use "data-protection" only for a provisioned Mac app.
# legacy_keychain_service = "" # Private upgrade compatibility only.
associated_domains = []
apns_environment = "development"

[push]
# key_id = "YOUR_APNS_KEY_ID"
# team_id = "YOUR_TEAM_ID"
# key_path = "~/.config/herdr-companion/secrets/AuthKey.p8"
# topic = "org.yourname.herdr.ios"
# environment = "sandbox"

[deployment]
# Operator metadata for local deployment scripts, never application defaults.
# checkout = "~/projects/herdr"
# python = "/opt/homebrew/bin/python3.13"
# install_root = "~/Applications"
# ssh_identity_file = "~/.ssh/herdr"


# Optional macOS release publishing, configured in this SAME private file.
# See docs/macos-releases.md. Values below are fictional examples or local references.
# The signing certificate and Ed25519 private key stay in Keychain.
# [deployment.macos_release]
# signing_mode = "development" # Personal testing, no Developer ID or notarization.
# signing_identity = "Apple Development: Example Publisher (ABCDE12345)"
# signing_team = "TEAM123456" # Actual certificate team ID, not its name suffix.
# For wider distribution, use signing_mode = "developer-id", a Developer ID
# Application identity, and notary_profile below. Omitted mode defaults to developer-id.
# notary_profile = "herdr-notary" # Existing notarytool Keychain profile name.
# notary_keychain = "~/Library/Keychains/login.keychain-db" # Optional custom Keychain path.
# sparkle_key_account = "org.example.herdr.release" # Existing account matching the pinned public key.
# sparkle_tools = "~/Developer/Sparkle-2.9.6/bin" # Official distribution's verified tool directory.
# private_patterns_file = "~/.config/herdr-companion/release-private-patterns.json"
# Optional patterns input: owner-only JSON array of regex strings. chmod 600; never commit.

[environment]
# Escape hatch for any documented environment setting. Values are data, not shell.
# Watchers is off until a person turns it on for the machine in the Mac app
# (Watchers > New watcher > Runs on) or with `herdr-watchers enable --i-confirm`;
# no edit or restart is needed. Setting HERDR_WATCHERS_ENABLED pins it instead:
# exactly "1" keeps it on and "0" keeps it off, and the app cannot change it.
# Run the companion under a restart-enabled supervisor (see docs/watchers.md).
# HERDR_WATCHERS_ENABLED = "1"
# HERDR_WATCHERS_PATH = "/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
# HERDR_WATCHERS_MAX_RUNS = "4"
# HERDR_WATCHERS_SUPERVISED = "1" # Only after verifying launchd/systemd supervision.
# HERDR_WATCHERS_BUILDER_MODEL = "provider/model"
# Headless agent runs (including HUD chat) default to one hour; range 1–86400 seconds.
# HERDR_HARNESS_AGENT_TIMEOUT_SECONDS = "7200"
# YOUR_PROVIDER_API_KEY = { file = "~/.config/herdr-companion/secrets/provider-api-key" } # For skim_model.
# HERDR_HARNESS_ACTIVE_WORK_STORE_PATH = "~/.local/share/herdr-companion/active-work.sqlite3"
# GH_HOST = "github.com"
# PATH = "/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin"

# New companions also accept this optional table. Older companions reject it;
# prefer the environment entries above while machines run mixed versions.
# [watchers]
# enabled = "1" # Pins Watchers like HERDR_WATCHERS_ENABLED; omit to let the app decide.
# max_runs = 4
# supervised = "1"
# path = "/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
# builder_model = "provider/model"
# store_path = "~/.local/share/herdr-companion/watchers.sqlite3"
# root = "~/.local/share/herdr-companion/watchers"
