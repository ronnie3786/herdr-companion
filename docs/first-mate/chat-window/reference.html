<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<title>First Mate Chat v8</title>
<meta name="description" content="First Mate chat app study v8: an iMessage-style conversation list, emoji halo avatars, inline smart capsules, and the native First Mate inspector, in the app's dusk glass. Synthetic data only.">
<style>
/* v8 · the chat in Mono × Herdr's dusk glass. Dark only: the same tokens, glass levels and Haze as the native app
   (HerdrTheme, HerdrGlass). The sidebar borrows iMessage's list; the details column is the native First Mate inspector. */
:root {
  color-scheme: dark;
  --base: #151519; --ink: #E9E9EC; --prose: #BABABE; --ink-2: #A9A9AD; --ink-3: #A9A9AD; --icon: #7F7F83;
  --f3: rgba(233, 233, 236, 0.03); --f5: rgba(233, 233, 236, 0.05); --f6: rgba(233, 233, 236, 0.06); --f8: rgba(233, 233, 236, 0.08);
  --f10: rgba(233, 233, 236, 0.10); --f15: rgba(233, 233, 236, 0.15); --hair: rgba(233, 233, 236, 0.07); --line: rgba(233, 233, 236, 0.10);
  --divider: rgba(233, 233, 236, 0.05);
  --accent: #AAA6F4; --on-accent: #151519;
  --signal: #9CCDB9; --success: #A3CBA7; --working: #E4C386; --alert: #E2A7B6; --attention: #FF9F0A; --idle: #8E8E96;
  /* Verification tones (FirstMateVerificationPalette, dark). */
  --positive: #78D4B8; --caution: #EDBF6B; --negative: #FF6B6B;
  /* Legible glass: base at 80% over the dusk, as HerdrTheme.Glass.sidebar and .pane. */
  --glass: rgba(21, 21, 25, 0.80); --float: rgba(25, 24, 32, 0.95); --disc: #2A2244; --eye: #D9D6FF; /* dusk violet, a step above the sky's #2A1D4A */
  /* HerdrDusk: the study's DESK, violet at 80%, blurred and saturated 110%. */
  --dusk:
    radial-gradient(70% 60% at 12% 8%, rgba(132, 98, 222, 0.80), transparent 62%),
    radial-gradient(55% 50% at 88% 6%, rgba(214, 120, 178, 0.60), transparent 60%),
    radial-gradient(80% 70% at 70% 100%, rgba(52, 70, 168, 0.80), transparent 65%),
    radial-gradient(60% 60% at 20% 95%, rgba(96, 58, 160, 0.65), transparent 60%),
    linear-gradient(180deg, #2A1D4A 0%, #171A36 55%, #0F1226 100%);
  /* HerdrHaze: a soft band at the top of the chat, at 6%. */
  --haze:
    radial-gradient(45% 95% at 18% 15%, rgb(133, 97, 222), transparent 70%),
    radial-gradient(40% 95% at 82% 10%, rgb(143, 77, 140), transparent 70%),
    radial-gradient(50% 100% at 50% 90%, rgb(36, 46, 107), transparent 70%),
    rgb(41, 28, 74);
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
  font: 13px/1.5 var(--sans); -webkit-font-smoothing: antialiased;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { color: var(--ink); background: var(--base); overflow: hidden; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
p { margin: 0; }
kbd { font: inherit; padding: 0 4px; border-radius: 4px; background: var(--f8); color: var(--ink-2); }
.ic { width: 12px; height: 12px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Window: one dusk behind every column ---------- */
.window { position: relative; isolation: isolate; height: 100dvh; min-height: 480px; overflow: hidden; }
.window::before { content: ""; position: absolute; inset: -60px; z-index: -1; background: var(--dusk); filter: blur(24px) saturate(1.1); pointer-events: none; }
.layout { height: 100%; display: grid; grid-template-columns: 320px minmax(0, 1fr) 0; transition: grid-template-columns 0.24s cubic-bezier(0.2, 0.9, 0.3, 1); }
.layout.open { grid-template-columns: 320px minmax(0, 1fr) 360px; }
.sidebar, .conversation, .details { position: relative; min-width: 0; min-height: 0; background: var(--glass); }

/* ---------- Avatars: an emoji in a glass disc, and First Mate's face ---------- */
.orb { --s: 48px; position: relative; flex: none; display: inline-block; width: var(--s); height: var(--s); }
.orb.sm { --s: 32px; } .orb.hd { --s: 38px; }
.disc {
  display: grid; place-items: center; flex: none; border-radius: 50%; line-height: 1;
  background: radial-gradient(circle at 50% 26%, rgba(170, 166, 244, 0.20), transparent 68%), var(--disc);
  box-shadow: inset 0 0 0 1px rgba(170, 166, 244, 0.20);
}
.orb > .disc { position: absolute; inset: 0; font-size: calc(var(--s) * 0.5); }
.disc.edge { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 55%, transparent), 0 0 8px -3px var(--c); }
.disc.av { width: 26px; height: 26px; font-size: 14px; }
.disc.crew { width: 32px; height: 32px; font-size: 17px; }
.face-orb {
  --s: 48px; position: relative; flex: none; display: grid; place-items: center; width: var(--s); height: var(--s); border-radius: 50%;
  background: radial-gradient(circle at 50% 34%, rgba(170, 166, 244, 0.22), transparent 64%), var(--disc);
  box-shadow: inset 0 0 0 1px rgba(170, 166, 244, 0.6), 0 0 18px -4px rgba(170, 166, 244, 0.55);
}
.face-orb::before { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 1px solid rgba(170, 166, 244, 0.32); }
.face-orb.av { --s: 26px; } .face-orb.av::before { display: none; }
.face-orb.mark { --s: 34px; } .face-orb.hd { --s: 38px; }
.face { width: 62%; height: 62%; overflow: visible; filter: drop-shadow(0 0 4px rgba(170, 166, 244, 0.8)); }
.face rect { fill: var(--eye); }
.face .f-mouth { fill: none; stroke: var(--eye); stroke-width: 2.2; stroke-linecap: round; }
.f-blink { transform-box: fill-box; transform-origin: center; animation: lid 5.2s infinite; }
@keyframes lid { 0%, 93%, 100% { transform: scaleY(1); } 95.5% { transform: scaleY(0.1); } }

/* ---------- Status words: in their own color. Work in progress breathes. ---------- */
.st { display: inline-block; min-width: 0; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 11.5px; font-weight: 600; color: var(--c); vertical-align: bottom; }
.st.quiet { color: var(--ink-3); font-weight: 500; }
.st.live { animation: breathe 2.4s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

/* ---------- Sidebar: an iMessage-style list ---------- */
.sidebar { display: flex; flex-direction: column; border-right: 1px solid var(--hair); }
.brand { display: flex; align-items: center; gap: 11px; padding: 16px 12px 12px 16px; }
.brand-text { flex: 1; min-width: 0; }
.brand-name { font-size: 15px; font-weight: 650; letter-spacing: -0.01em; line-height: 1.25; }
.brand-sub { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 11px; color: var(--ink-3); }
.icon-button { display: grid; place-items: center; flex: none; width: 30px; height: 30px; padding: 0; border: 0; border-radius: 8px; background: none; color: var(--icon); }
.icon-button:hover { background: var(--f8); color: var(--ink); }
.icon-button svg { width: 17px; height: 17px; }
.icon-button[aria-expanded="true"] { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
.search-wrap { position: relative; display: block; margin: 0 12px 6px; }
.search-wrap svg { position: absolute; left: 11px; top: 50%; width: 14px; height: 14px; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; }
.search-wrap input { width: 100%; height: 34px; padding: 0 10px 0 32px; border: 0; border-radius: 9px; outline: none; background: var(--f5); box-shadow: inset 0 0 0 1px var(--f8); font-size: 13px; }
.search-wrap input:focus { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 65%, transparent); }
input::placeholder { color: var(--ink-3); }
.nav { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 8px 14px; scrollbar-width: thin; scrollbar-color: var(--f15) transparent; }
.section { margin: 6px -8px 2px; padding: 12px 20px 4px; border-top: 1px solid var(--hair); font-size: 11px; font-weight: 600; color: var(--ink-3); }
/* Unread dot | avatar | text. Rows are split by a hairline that starts at the text, as in Messages. */
.row {
  position: relative; width: 100%; display: grid; grid-template-columns: 10px 48px minmax(0, 1fr); column-gap: 9px; align-items: center;
  padding: 10px 10px 10px 4px; border: 0; border-radius: 10px; background: none; text-align: left; color: var(--ink);
}
.row + .row::before { content: ""; position: absolute; top: 0; left: 81px; right: 10px; height: 1px; background: var(--hair); }
.row:hover { background: var(--f5); }
.row.selected { background: var(--f10); }
.row:hover::before, .row.selected::before, .row:hover + .row::before, .row.selected + .row::before { opacity: 0; }
.new-dot { justify-self: center; width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.row-body { min-width: 0; display: flex; flex-direction: column; }
.row-top { display: flex; align-items: baseline; gap: 6px; }
.row-name { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 13.5px; font-weight: 600; letter-spacing: -0.005em; }
.row-time { flex: none; font-size: 11px; color: var(--ink-3); }
.row-preview { margin-top: 1px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 12px; color: var(--ink-3); }
.row-preview .typing-word { color: var(--accent); }
.row-status { display: flex; margin-top: 3px; min-height: 17px; }
.row-status .summary { font-size: 11.5px; color: var(--ink-2); }
.empty { padding: 10px 12px; font-size: 12px; color: var(--ink-3); }

/* ---------- Conversation ---------- */
.conversation { display: flex; flex-direction: column; overflow: hidden; }
.haze { position: absolute; left: 0; right: 0; top: 0; height: 280px; opacity: 0.06; background: var(--haze); -webkit-mask-image: linear-gradient(#000, transparent); mask-image: linear-gradient(#000, transparent); pointer-events: none; }
.chat-head { position: relative; z-index: 1; flex: none; display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 14px 0 22px; border-bottom: 1px solid var(--hair); }
.head-info { flex: 1; min-width: 0; }
.head-name { margin: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 14.5px; font-weight: 650; letter-spacing: -0.01em; }
.head-sub { display: flex; align-items: center; gap: 10px; margin-top: 1px; overflow: hidden; white-space: nowrap; font-size: 11.5px; color: var(--ink-3); }
.head-sub .st { flex: none; }
.messages { position: relative; z-index: 1; flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; padding: 22px max(24px, calc((100% - 720px) / 2)) 16px; scrollbar-width: thin; scrollbar-color: var(--f15) transparent; }
.day { align-self: center; margin: 4px 0 8px; padding: 3px 11px; border-radius: 10px; background: var(--f5); font-size: 11px; color: var(--ink-3); }
.msg { display: flex; align-items: flex-end; gap: 8px; margin-top: 14px; }
.msg.cont { margin-top: 3px; }
.msg.user { justify-content: flex-end; }
.msg.fresh { animation: rise 0.26s ease-out; }
.av-slot { width: 26px; flex: none; }
.bubble { min-width: 0; max-width: min(86%, 560px); padding: 8px 13px 6px; border-radius: 17px; }
.msg.them .bubble { background: var(--f6); box-shadow: inset 0 0 0 1px var(--hair); }
.msg.them.tail .bubble { border-bottom-left-radius: 5px; }
.msg.user .bubble { background: color-mix(in srgb, var(--accent) 20%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 26%, transparent); }
.msg.user.tail .bubble { border-bottom-right-radius: 5px; }
.speaker { margin-bottom: 2px; font-size: 11px; font-weight: 600; color: var(--accent); }
.msg.agent .speaker { color: var(--ink-2); }
.speaker small { margin-left: 5px; font-size: 11px; font-weight: 500; color: var(--ink-3); }
.bubble p { font-size: 13.5px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
.meta { display: flex; justify-content: flex-end; gap: 6px; margin-top: 2px; font-size: 10px; color: var(--ink-3); }
.meta .via { color: var(--accent); }
.bubble.typing { display: flex; gap: 4px; padding: 13px 14px; }
.bubble.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); animation: dots 1.1s infinite ease-in-out; }
.bubble.typing i:nth-child(2) { animation-delay: 0.15s; } .bubble.typing i:nth-child(3) { animation-delay: 0.3s; }
@keyframes dots { 0%, 60%, 100% { opacity: 0.3; transform: none; } 30% { opacity: 1; transform: translateY(-2px); } }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* Smart capsules: a feature or crew member tagged inside a sentence. Hover for a live readout; click to go there. */
.cap {
  display: inline-flex; align-items: center; gap: 5px; max-width: 100%; height: 21px; margin: 0 1px; padding: 0 8px 0 2px; vertical-align: -5px;
  border: 0; border-radius: 11px; background: color-mix(in srgb, var(--c) 11%, var(--f6)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 36%, transparent);
  color: var(--ink); font-size: 12px; font-weight: 600; line-height: 1; white-space: nowrap; transition: background 0.12s, box-shadow 0.12s;
}
button.cap:hover, button.cap:focus-visible, button.cap.on { background: color-mix(in srgb, var(--c) 22%, var(--f6)); box-shadow: inset 0 0 0 1px var(--c); }
.cap .disc { width: 17px; height: 17px; font-size: 10px; box-shadow: none; background: var(--disc); }
.cap .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
.cap .dot { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
.cap.agent .disc { background: rgba(233, 233, 236, 0.1); }

.file { display: flex; align-items: center; gap: 10px; width: 100%; margin: 8px 0 3px; padding: 8px 10px; border: 0; border-radius: 11px; background: rgba(21, 21, 25, 0.45); box-shadow: inset 0 0 0 1px var(--hair); text-align: left; color: var(--ink); }
.file:hover { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 55%, transparent); }
.file-icon { display: grid; place-items: center; flex: none; width: 30px; height: 36px; border-radius: 7px; background: color-mix(in srgb, var(--accent) 13%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 32%, transparent); color: var(--accent); }
.file-icon .ic { width: 15px; height: 15px; }
.file-text { flex: 1; min-width: 0; }
.file-text strong, .file-text small { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.file-text strong { font-size: 12.5px; font-weight: 600; }
.file-text small { margin-top: 1px; font-size: 11px; color: var(--ink-3); }
.file-go { color: var(--icon); }

/* ---------- Composer: suggested replies, the @ picker, and the pill ---------- */
.composer-zone { position: relative; z-index: 2; flex: none; padding: 4px max(24px, calc((100% - 720px) / 2)) 12px; }
.suggest { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 8px 2px; }
.suggest:empty { display: none; }
.chip { height: 28px; padding: 0 12px; border: 0; border-radius: 14px; background: rgba(21, 21, 25, 0.5); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent); color: var(--accent); font-size: 12px; font-weight: 600; }
.chip:hover { background: color-mix(in srgb, var(--accent) 16%, transparent); }
.composer { display: flex; align-items: flex-end; gap: 6px; padding: 5px; border-radius: 22px; background: var(--f5); box-shadow: inset 0 0 0 1px var(--f10), 0 10px 28px rgba(0, 0, 0, 0.18); transition: box-shadow 0.15s; }
.composer:focus-within { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 65%, transparent), 0 0 18px -10px var(--accent); }
.input { flex: 1; min-width: 0; min-height: 34px; max-height: 150px; overflow-y: auto; padding: 7px 4px; outline: 0; font-size: 13.5px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
.input:empty::before { content: attr(data-placeholder); color: var(--ink-3); pointer-events: none; }
.input .cap { vertical-align: -5px; cursor: default; }
.round { position: relative; display: grid; place-items: center; flex: none; width: 34px; height: 34px; padding: 0; border: 0; border-radius: 50%; background: var(--f8); color: var(--ink-2); transition: background 0.12s, color 0.12s; }
.round:hover { background: var(--f15); color: var(--ink); }
.round svg { width: 17px; height: 17px; }
.mic .i-send { display: none; }
.has-text .mic { background: var(--accent); color: var(--on-accent); }
.has-text .mic .i-mic { display: none; } .has-text .mic .i-send { display: block; }
.listening .mic { background: var(--alert); color: var(--base); }
.listening .mic::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--alert) 50%, transparent); animation: pulse 1.1s ease-out infinite; }
.listening .composer { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--alert) 70%, transparent), 0 0 22px -8px var(--alert); }
@keyframes pulse { from { transform: scale(0.9); opacity: 1; } to { transform: scale(1.25); opacity: 0; } }
.hint { display: flex; gap: 10px; padding: 7px 12px 0; font-size: 10.5px; color: var(--ink-3); }
.hint-right { margin-left: auto; }
.listening .hint-left { color: var(--alert); }
.picker {
  position: absolute; left: max(24px, calc((100% - 720px) / 2)); bottom: calc(100% - 2px); width: min(320px, calc(100% - 48px)); max-height: 320px; overflow-y: auto;
  padding: 6px; border-radius: 12px; background: var(--float); box-shadow: inset 0 0 0 1px var(--line), 0 18px 40px rgba(0, 0, 0, 0.45);
  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); animation: rise 0.14s ease-out;
}
.picker-label { padding: 5px 8px 4px; font-size: 11px; font-weight: 600; color: var(--ink-3); }
.opt { display: flex; align-items: center; gap: 9px; width: 100%; padding: 5px 8px; border: 0; border-radius: 8px; background: none; text-align: left; color: var(--ink); font-size: 12.5px; }
.opt.active { background: var(--f10); }
.opt .disc { width: 24px; height: 24px; font-size: 13px; }
.opt .nm { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-weight: 600; }
.opt .role { flex: none; font-size: 11px; color: var(--ink-3); }
.opt .st { flex: none; font-size: 11px; }

/* ---------- Details: the native First Mate inspector (FirstMateInspectorView) ---------- */
.details { display: flex; flex-direction: column; overflow: hidden; border-left: 1px solid var(--hair); visibility: hidden; opacity: 0; transition: opacity 0.2s, visibility 0.24s; }
.open .details { visibility: visible; opacity: 1; }
.itabs { flex: none; display: flex; align-items: stretch; gap: 16px; height: 60px; padding: 0 16px; border-bottom: 1px solid var(--hair); }
.itab { position: relative; padding: 0; border: 0; background: none; font-size: 12px; color: var(--ink-3); }
.itab:hover { color: var(--ink-2); }
.itab.on { color: var(--ink); }
.itab.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--ink); }
.ibody { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 14px 16px 16px; scrollbar-width: thin; scrollbar-color: var(--f15) transparent; }
.ifoot { flex: none; display: flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 12px; border-top: 1px solid var(--hair); font-size: 11px; color: var(--ink-3); white-space: nowrap; }
.ifoot > .ic { color: var(--icon); }
.ifoot .rev { margin-left: auto; font-variant-numeric: tabular-nums; }
.micro { display: flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }
.cbadge { display: inline-grid; place-items: center; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--f10); color: var(--ink-2); font-size: 9px; font-weight: 600; letter-spacing: 0; font-variant-numeric: tabular-nums; }
.hcard { display: flex; flex-direction: column; gap: 12px; padding: 12px; border-radius: 12px; background: var(--f3); box-shadow: inset 0 0 0 1px var(--line); }
.h15 { margin: 0; font-size: 15px; font-weight: 600; color: var(--ink); }
.sub12 { font-size: 12px; line-height: 1.5; color: var(--ink-3); }
.link-btn { display: inline-flex; align-items: center; gap: 5px; min-height: 28px; padding: 0; border: 0; background: none; color: var(--accent); font-size: 11px; font-weight: 500; }
.link-btn:hover { text-decoration: underline; text-underline-offset: 3px; }
.nst { display: inline-flex; align-items: center; gap: 5px; flex: none; white-space: nowrap; font-size: 11px; color: var(--c); }
.nst .ic { width: 10px; height: 10px; }
.fn { font-size: 11px; line-height: 1.45; color: var(--ink-2); }
.hr { height: 1px; flex: none; background: var(--hair); }
/* Pull requests (FirstMatePullRequestsSection) */
.prs { display: flex; flex-direction: column; gap: 8px; }
.prs .micro .ic { width: 11px; height: 11px; color: var(--icon); }
.prs .link-btn { margin-left: auto; letter-spacing: 0; text-transform: none; }
.pr { display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px; border-radius: 8px; background: var(--f3); box-shadow: inset 0 0 0 1px var(--line); }
.pr > .ic { width: 13px; height: 13px; margin-top: 3px; color: var(--signal); }
.pr-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.pr-title { font-size: 13px; font-weight: 600; }
.pr-meta { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 11px; color: var(--ink-3); }
.pr-actions { flex: none; display: flex; gap: 6px; }
.obtn { height: 24px; padding: 0 9px; border: 0; border-radius: 6px; background: var(--f3); box-shadow: inset 0 0 0 1px var(--line); font-size: 11.5px; color: var(--ink); }
.obtn:hover { background: var(--f8); }

    const refs = [...text.matchAll(TOKEN)].map(m => resolve(m[1])).filter(Boolean);
    if (c === lead) {
      if (/offline/i.test(plain(text)) && !refs.length) return summary(featureById('offline'));
      const r = refs[0];
      if (r && r.kind === 'feature') return summary(r.f);
      if (r) return `[[${r.token}]] is on [[@${r.f.id}]]. ${r.a.note}.`;
      return 'Noted. In the real app I’d start a new feature from this. Here it’s a demo, so nothing was created.';
    }
    const other = refs.find(r => r.kind === 'feature' && r.f !== c);
    if (other) return `Noted. I’ll check how that lands with [[@${other.f.id}]] and post what I hear here.`;
    const busy = c.agents.find(a => a.status !== 'done') || c.agents[c.agents.length - 1];
    return `On it. I’ll pass that to [[${busy.key}]] and post an update here.`;
  }
  function applyThen(c, then) {
    const { agents: crew, visit, addAgents, pr, event, ...rest } = then;
    Object.assign(c, rest);
    if (crew) Object.entries(crew).forEach(([i, change]) => Object.assign(c.agents[Number(i)], change));
    if (visit) c.visits.push(visit);
    if (addAgents) addAgents.forEach(a => c.agents.push({ ...a, visit: focusIndex(c) }));
    if (pr) c.prs.push(pr);
    if (event) c.events.push(event);
    indexAgents();
  }
  function send(raw, opts = {}) {
    const text = String(raw).replace(/ /g, ' ').trim();
    if (!text) return;
    const c = current();
    const choice = !opts.choice && c.suggest ? c.suggest.find(s => s.match && s.match.test(text)) : opts.choice;
    freshFrom = c.messages.length;
    c.messages.push({ kind: 'user', text, time: now(), voice: !!opts.voice });
    c.time = now(); c.unread = 0; c.typing = true;
    if (choice) c.suggest = null;
    clearDraft(); renderAll();
    const reply = choice && choice.reply ? choice.reply : replyFor(c, text);
    setTimeout(() => {
      c.typing = false;
      if (choice && choice.then) applyThen(c, choice.then);
      freshFrom = c.messages.length;
      c.messages.push({ kind: 'fm', text: reply, time: now() });
      c.time = now();
      if (current() !== c) c.unread = (c.unread || 0) + 1;
      renderAll(current() === c);
    }, 950);
  }

  // ---------- Composer: contenteditable with @ tags ----------
  const draft = $('draft');
  const isEmpty = () => !draft.textContent.replace(/[\s ]/g, '') && !draft.querySelector('.cap');
  function serialize(node) {
    let out = '';
    node.childNodes.forEach(n => {
      if (n.nodeType === 3) out += n.data;
      else if (n.dataset && n.dataset.token) out += `[[${n.dataset.token}]]`;
      else if (n.nodeName === 'BR') out += '\n';
      else out += (n.nodeName === 'DIV' || n.nodeName === 'P' ? '\n' : '') + serialize(n);
    });
    return out;
  }
  function syncComposer() {
    if (isEmpty() && draft.innerHTML !== '') draft.innerHTML = '';
    const has = !isEmpty() && !listening;
    $('composer').classList.toggle('has-text', has);
    $('mic').setAttribute('aria-label', has ? 'Send' : 'Hold to talk');
    $('mic').title = has ? 'Send' : 'Hold to talk';
  }
  function clearDraft() { draft.innerHTML = ''; syncComposer(); }
  function capNode(token) { const t = document.createElement('template'); t.innerHTML = cap(token, true); return t.content.firstChild; }

  let pick = null;
  function candidates() {
    const list = features.map(f => resolve('@' + f.id));
    if (!isLead()) current().agents.forEach(a => list.push(resolve(a.key)));
    return list;
  }
  function updatePicker() {
    const sel = getSelection();
    if (!sel.rangeCount || !sel.isCollapsed) return closePicker();
    const node = sel.anchorNode;
    if (!node || node.nodeType !== 3 || !draft.contains(node)) return closePicker();
    const m = node.data.slice(0, sel.anchorOffset).match(/(?:^|[\s( ])@([^@\n]{0,24})$/);
    if (!m || /^\s|\s\s/.test(m[1])) return closePicker();
    const q = m[1].toLowerCase().replace(/ /g, ' ');
    const items = candidates().filter(r => r.title.toLowerCase().includes(q)).slice(0, 8);
    if (!items.length) return closePicker();
    pick = { node, start: sel.anchorOffset - m[1].length - 1, end: sel.anchorOffset, items, active: 0 };
    renderPicker();
  }
  function renderPicker() {
    let kind = '';
    $('picker').innerHTML = pick.items.map((r, i) => {
      const label = r.kind !== kind ? `<div class="picker-label">${r.kind === 'feature' ? 'Features' : `Crew on ${esc(current().title)}`}</div>` : '';
      kind = r.kind;
      return `${label}<button type="button" class="opt${i === pick.active ? ' active' : ''}" role="option" aria-selected="${i === pick.active}" data-pick="${i}">${disc(r.emoji, r.status)}<span class="nm">${esc(r.title)}</span>${r.kind === 'agent' ? `<span class="role">${esc(r.a.role)}</span>` : st(r.status, rowWord(r.f))}</button>`;
    }).join('');
    $('picker').hidden = false;
    const active = $('picker').querySelector('.opt.active');
    if (active) active.scrollIntoView({ block: 'nearest' });
  }
  function closePicker() { pick = null; $('picker').hidden = true; }
  function choosePick(i) {
    if (!pick) return;
    const r = pick.items[i === undefined ? pick.active : i];
    if (!r) return;
    const range = document.createRange();
    range.setStart(pick.node, pick.start); range.setEnd(pick.node, pick.end); range.deleteContents();
    const space = document.createTextNode(' ');
    range.insertNode(space); range.insertNode(capNode(r.token));
    const caret = document.createRange(); caret.setStart(space, 1); caret.collapse(true);
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(caret);
    closePicker(); syncComposer(); draft.focus();
  }
  draft.addEventListener('keydown', e => {
    if (pick) {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); pick.active = (pick.active + (e.key === 'ArrowDown' ? 1 : -1) + pick.items.length) % pick.items.length; renderPicker(); return; }
      if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); choosePick(); return; }
      if (e.key === 'Escape') { e.preventDefault(); closePicker(); return; }
    }
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(serialize(draft)); }
  });
  draft.addEventListener('input', () => { syncComposer(); updatePicker(); });
  draft.addEventListener('keyup', e => { if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') updatePicker(); });
  draft.addEventListener('paste', e => { e.preventDefault(); document.execCommand('insertText', false, e.clipboardData.getData('text/plain')); });
  draft.addEventListener('blur', () => setTimeout(() => { if (document.activeElement !== draft) closePicker(); }, 120));
  $('picker').addEventListener('pointerdown', e => { const o = e.target.closest('[data-pick]'); if (!o) return; e.preventDefault(); choosePick(Number(o.dataset.pick)); });

  // ---------- The mic: tap sends typed text; press and hold to talk ----------
  let listening = null, holdTimer = 0;
  const HINT = $('hint-left').innerHTML;
  function voiceLine() {
    if (isLead()) return 'What’s moving on offline sync?';
    if (selected === 'receipts' && current().suggest) return 'Ship it iPhone-only and file the iPad bug.';
    return 'Sounds good. Keep going and ping me when it’s ready.';
  }
  function startListening() {
    const words = voiceLine().split(' ');
    listening = { words, shown: 0, timers: [] };
    document.body.classList.add('listening');
    clearDraft(); draft.dataset.placeholder = 'Listening…';
    $('hint-left').textContent = 'Listening. Let go to send, or press Esc to cancel.';
    const L = listening;
    const next = () => { if (listening !== L || L.shown >= words.length) return; L.shown++; draft.textContent = words.slice(0, L.shown).join(' '); L.timers.push(setTimeout(next, 170 + Math.random() * 120)); };
    L.timers.push(setTimeout(next, 380));
  }
  function stopListening(sendIt) {
    const L = listening;
    if (!L) return;
    listening = null;
    L.timers.forEach(clearTimeout);
    document.body.classList.remove('listening');
    $('hint-left').innerHTML = HINT;
    const text = L.words.slice(0, L.shown).join(' ');
    clearDraft(); renderHead();
    if (sendIt && L.shown > 1) send(text, { voice: true }); else if (sendIt) toast('Nothing heard.');
  }
  $('mic').addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    if ($('composer').classList.contains('has-text')) { e.preventDefault(); send(serialize(draft)); return; }
    e.preventDefault();
    holdTimer = setTimeout(() => { holdTimer = 0; startListening(); }, 300);
  });
  window.addEventListener('pointerup', () => {
    if (listening) { stopListening(true); return; }
    if (holdTimer) { clearTimeout(holdTimer); holdTimer = 0; toast('Hold the mic to talk.'); }
  });
  $('mic').addEventListener('click', e => { if (e.detail === 0 && $('composer').classList.contains('has-text')) send(serialize(draft)); else if (e.detail === 0) toast('Hold the mic to talk.'); });

  // ---------- Smart capsule readout ----------
  const pop = $('pop');
  let popFor = null, popTimer = 0, hideTimer = 0;
  function featurePop(f) {
    const action = selected === f.id ? '<span>This chat</span>' : `<button type="button" class="pop-action" data-open="${f.id}">Open chat</button>`;
    return `<div class="pop-head">${orb(f, 'sm')}<div class="pop-id"><div class="pop-title">${esc(f.title)}</div><div class="pop-sub">${st(f.status, rowWord(f))}</div></div></div>
      <p class="pop-now">${esc(f.now)}</p>${segs(f)}
      <div class="pop-foot"><span>${esc(stepText(f))}</span>${action}</div>`;
  }
  function agentPop(a) {
    return `<div class="pop-head">${disc(a.emoji, a.status, 'crew')}<div class="pop-id"><div class="pop-title">${esc(a.title)}</div><div class="pop-sub">${esc(a.role)} on ${esc(a.feature.title)}</div></div></div>
      <p class="pop-now">${esc(a.note)}.</p>
      <div class="pop-foot">${st(a.status, agentWord(a))}<button type="button" class="pop-action" data-agent="${a.key}">Show in inspector</button></div>`;
  }
  function showPop(el) {
    const r = resolve(el.dataset.token);
    if (!r) return;
    clearTimeout(hideTimer);
    if (popFor && popFor !== el) popFor.classList.remove('on');
    popFor = el; el.classList.add('on');
    pop.innerHTML = r.kind === 'feature' ? featurePop(r.f) : agentPop(r.a);
    const rect = el.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
    let top = rect.bottom + 8;
    if (top + h > innerHeight - 8) top = rect.top - h - 8;
    pop.style.left = `${clamp(rect.left - 4, 8, innerWidth - w - 8)}px`;
    pop.style.top = `${Math.max(8, top)}px`;
    pop.classList.add('show');
  }
  function hidePop(immediately) {
    clearTimeout(popTimer); clearTimeout(hideTimer);
    const go = () => { pop.classList.remove('show'); if (popFor) popFor.classList.remove('on'); popFor = null; };
    if (immediately) go(); else hideTimer = setTimeout(go, 160);
  }
  $('messages').addEventListener('pointerover', e => {
    const el = e.target.closest('button.cap');
    if (!el || el === popFor) { if (el) clearTimeout(hideTimer); return; }
    clearTimeout(popTimer); clearTimeout(hideTimer);
    popTimer = setTimeout(() => showPop(el), popFor ? 0 : 200);
  });
  $('messages').addEventListener('pointerout', e => {
    const el = e.target.closest('button.cap');
    if (!el || (e.relatedTarget && el.contains(e.relatedTarget))) return;
    clearTimeout(popTimer);
    if (!(e.relatedTarget && pop.contains(e.relatedTarget))) hidePop();
  });
  $('messages').addEventListener('focusin', e => { const el = e.target.closest('button.cap'); if (el) showPop(el); });
  $('messages').addEventListener('focusout', e => { if (!(e.relatedTarget && pop.contains(e.relatedTarget))) hidePop(); });
  $('messages').addEventListener('scroll', () => hidePop(true), { passive: true });
  pop.addEventListener('pointerenter', () => clearTimeout(hideTimer));
  pop.addEventListener('pointerleave', () => hidePop());
  pop.addEventListener('focusout', e => { if (!(e.relatedTarget && (pop.contains(e.relatedTarget) || e.relatedTarget === popFor))) hidePop(); });
  pop.addEventListener('click', e => {
    const open = e.target.closest('[data-open]'); if (open) { hidePop(true); select(open.dataset.open); return; }
    const agent = e.target.closest('[data-agent]'); if (agent) { hidePop(true); showAgent(agent.dataset.agent); }
  });

  // ---------- Wiring ----------
  $('nav').addEventListener('click', e => { const r = e.target.closest('[data-open]'); if (r) select(r.dataset.open); });
  $('search').addEventListener('input', renderNav);
  $('messages').addEventListener('click', e => {
    const c = e.target.closest('button.cap');
    if (c) { const r = resolve(c.dataset.token); hidePop(true); if (!r) return; if (r.kind === 'feature') { if (r.f.id !== selected) select(r.f.id); } else showAgent(r.token); return; }
    const d = e.target.closest('[data-doc]'); if (d) showDoc(d.dataset.doc);
  });
  $('suggest').addEventListener('click', e => {
    const b = e.target.closest('[data-suggest]'); if (!b) return;
    const c = current(), choice = c.suggest[Number(b.dataset.suggest)];
    if (choice.open) { select(choice.open); return; }
    send(choice.text, { choice });
  });
  $('itabs').addEventListener('click', e => { const t = e.target.closest('[data-tab]'); if (t) setTab(t.dataset.tab); });
  $('itabs').addEventListener('keydown', e => {
    if (!['ArrowLeft', 'ArrowRight'].includes(e.key)) return;
    e.preventDefault();
    setTab(TABS[(TABS.indexOf(tab) + (e.key === 'ArrowRight' ? 1 : -1) + TABS.length) % TABS.length]);
    $('itabs').querySelector('.itab.on').focus();
  });
  $('ibody').addEventListener('click', e => {
    const go = e.target.closest('[data-go]');
    if (go) {
      // A resource chip in the lead's journal belongs to one feature: go there first.
      const owner = go.dataset.visit ? go.dataset.visit.split(':')[0] : go.dataset.feature;
      if (owner && owner !== selected) select(owner);
      if (go.dataset.visit) { openGroups.add(go.dataset.visit); openGroups.delete('!' + go.dataset.visit); }
      if (go.dataset.go === 'Documents') docMode = 'documents';
      setDetails(true); setTab(go.dataset.go); return;
    }
    const open = e.target.closest('[data-open]'); if (open) { select(open.dataset.open); return; }
    if (e.target.closest('[data-links]')) { docMode = 'links'; setTab('Documents'); return; }
    const mode = e.target.closest('[data-docmode]'); if (mode) { docMode = mode.dataset.docmode; renderDetails(); return; }
    const graph = e.target.closest('[data-graph]'); if (graph) { graphMode = graph.dataset.graph === '1'; renderDetails(); return; }
    const doc = e.target.closest('[data-doc-toggle]'); if (doc) { toggleDoc(doc); return; }
    const prOpen = e.target.closest('[data-pr-open]'); if (prOpen) { toast(`In the real app this opens PR #${prOpen.dataset.prOpen}.`); return; }
    if (e.target.closest('[data-pr-copy]')) toast('Copied the pull request link.');
  });
  // Disclosure state survives re-renders. Closing a group that opens by default is remembered too.
  $('ibody').addEventListener('toggle', e => {
    const key = e.target.dataset && e.target.dataset.group;
    if (!key) return;
    if (e.target.open) { openGroups.add(key); openGroups.delete('!' + key); } else { openGroups.delete(key); openGroups.add('!' + key); }
  }, true);
  $('details-toggle').addEventListener('click', () => setDetails(!detailsOpen));
  $('new-chat').addEventListener('click', () => { select('lead'); draft.focus(); toast('Tell First Mate what to build, and it starts a new feature.'); });
  $('attach').addEventListener('click', () => toast('Files aren’t part of this demo.'));
  document.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if ((e.metaKey || e.ctrlKey) && k === 'i') { e.preventDefault(); setDetails(!detailsOpen); return; }
    if ((e.metaKey || e.ctrlKey) && k === 'k') { e.preventDefault(); $('search').focus(); return; }
    if (e.key === 'Escape') {
      if (listening) stopListening(false);
      else if (pop.classList.contains('show')) hidePop(true);
      else if (detailsOpen && innerWidth <= 1140) setDetails(false);
    }
  });

  let toastTimer = 0;
  function toast(text) { $('toast').textContent = text; $('toast').classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => $('toast').classList.remove('show'), 2200); }

  $('brand-face').innerHTML = FACE;
  renderAll();
  setDetails(innerWidth >= 1280);
})();
</script>
</body>
</html>
